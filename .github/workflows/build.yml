name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cần quyền ghi để tạo Release kèm APK khi gắn tag v*
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Gradle 4.1 + AGP 3.0 chỉ chạy JDK 8)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------------------------------------
      # KHOÁ KÝ CỐ ĐỊNH — phải chuẩn bị TRƯỚC khi build.
      # Trước đây mỗi lần CI chạy lại sinh khoá ký mới → APK mỗi bản một chữ ký
      # khác nhau → Android từ chối cài đè:
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE: signatures do not match
      #   (pm báo lỗi rồi adb shell đóng → Termux chỉ thấy "error: closed")
      # Giờ khoá ký được giữ lại giữa các lần build:
      #   1. Secret R1Y_KEYSTORE_B64 (base64 file .jks) — bền nhất, không mất
      #   2. actions/cache — tự sinh lần đầu, các lần sau dùng lại
      # ------------------------------------------------------------------
      - name: Khôi phục khoá ký đã dùng cho các bản trước
        uses: actions/cache@v4
        with:
          path: ~/.r1y-signing
          key: r1y-signing-keystore-v2
          restore-keys: |
            r1y-signing-keystore-

      - name: Chuẩn bị khoá ký cố định (để cài đè được bản cũ)
        env:
          R1Y_KEYSTORE_B64: ${{ secrets.R1Y_KEYSTORE_B64 }}
          SECRET_STORE_PASS: ${{ secrets.R1Y_STORE_PASS }}
          SECRET_KEY_ALIAS: ${{ secrets.R1Y_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.R1Y_KEY_PASS }}
        run: |
          set -e
          DIR="$HOME/.r1y-signing"
          KS="$DIR/r1y-release.jks"
          mkdir -p "$DIR"

          STORE_PASS="r1y-release-pass"
          KEY_ALIAS="r1y"
          KEY_PASS="r1y-release-pass"
          if [ -n "$SECRET_STORE_PASS" ]; then STORE_PASS="$SECRET_STORE_PASS"; fi
          if [ -n "$SECRET_KEY_ALIAS" ]; then KEY_ALIAS="$SECRET_KEY_ALIAS"; fi
          if [ -n "$SECRET_KEY_PASS" ]; then KEY_PASS="$SECRET_KEY_PASS"; fi

          if [ -f "$KS" ]; then
            echo "Dùng khoá ký đã lưu trong cache."
          elif [ -n "$R1Y_KEYSTORE_B64" ]; then
            echo "$R1Y_KEYSTORE_B64" | base64 -d > "$KS"
            echo "Dùng khoá ký từ secret R1Y_KEYSTORE_B64."
          else
            echo "Chưa có khoá ký — tạo mới MỘT lần, các lần build sau dùng lại."
            keytool -genkeypair -v -keystore "$KS" -storetype JKS \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=R1-Y Release,O=BachDaThan,C=VN"
          fi

          {
            echo "R1Y_KEYSTORE=$KS"
            echo "R1Y_STORE_PASS=$STORE_PASS"
            echo "R1Y_KEY_ALIAS=$KEY_ALIAS"
            echo "R1Y_KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

          echo "Chữ ký của khoá đang dùng:"
          keytool -list -v -keystore "$KS" -storepass "$STORE_PASS" \
            | grep -E "Alias name|SHA256:" | head -4 || true

      - name: Build Debug APK
        env:
          R1Y_KEYSTORE: ${{ env.R1Y_KEYSTORE }}
          R1Y_STORE_PASS: ${{ env.R1Y_STORE_PASS }}
          R1Y_KEY_ALIAS: ${{ env.R1Y_KEY_ALIAS }}
          R1Y_KEY_PASS: ${{ env.R1Y_KEY_PASS }}
        run: |
          cd app
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-debug.log

      - name: Báo lỗi Gradle (nếu có)
        if: always()
        run: |
          for f in /tmp/gradle-debug.log; do
            [ -s "$f" ] || continue
            if grep -qE "FAILURE|error:|Could not|What went wrong" "$f"; then
              MSG=$(grep -E "FAILURE|error:|Could not|What went wrong|Caused by|> " -A2 "$f" | head -c 3000 | tr '\n' '|')
              echo "::error title=GradleLog::${MSG}"
            fi
          done

      - name: Build Release APK
        env:
          R1Y_KEYSTORE: ${{ env.R1Y_KEYSTORE }}
          R1Y_STORE_PASS: ${{ env.R1Y_STORE_PASS }}
          R1Y_KEY_ALIAS: ${{ env.R1Y_KEY_ALIAS }}
          R1Y_KEY_PASS: ${{ env.R1Y_KEY_PASS }}
        run: |
          cd app
          ./gradlew assembleRelease --stacktrace

      - name: In chữ ký APK (để biết bản sau có cài đè được không)
        if: always()
        run: |
          APK=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            echo "APK: $APK"
            keytool -printcert -jarfile "$APK" 2>/dev/null \
              | grep -E "Owner|SHA256" | head -4 || echo "Không đọc được chữ ký."
          fi

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" app/app/build.gradle | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: List APK files
        run: |
          cd app/app/build/outputs/apk
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Rename APKs
        run: |
          cd app/app/build/outputs/apk
          if [ -f "debug/app-debug.apk" ]; then
            mv debug/app-debug.apk debug/R1Y-v${{ steps.version.outputs.version_name }}-debug.apk
          fi
          if [ -f "release/app-release.apk" ]; then
            mv release/app-release.apk release/R1Y-v${{ steps.version.outputs.version_name }}-release.apk
          elif [ -f "release/app-release-unsigned.apk" ]; then
            # giữ chữ "unsigned" trong tên để tool biết APK chưa ký
            mv release/app-release-unsigned.apk release/R1Y-v${{ steps.version.outputs.version_name }}-unsigned.apk
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: R1Y-Debug-APK
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: R1Y-Release-APK
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Generate checksum
        run: |
          cd app/app/build/outputs/apk/release
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Checksums
          path: app/app/build/outputs/apk/release/checksums.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: R1Y-Release-APK
          path: release-apk

      - name: Download Checksums
        uses: actions/download-artifact@v4
        with:
          name: Checksums
          path: checksums

      - name: Get version from tag
        id: tag_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: R1-Y ${{ steps.tag_version.outputs.version }}
          body: |
            ## R1-Y — Firmware cho loa Phicomm R1

            ### 📦 Phiên bản: ${{ steps.tag_version.outputs.version }}

            ### 📥 Tải xuống
            - **Release APK**: bản production, đã tối ưu
            - **Checksums**: SHA256 để kiểm tra tính toàn vẹn

            ### 🚀 Cài đặt qua cùng WiFi
            ```bash
            # Tải APK
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.tag_version.outputs.version }}/R1Y-v${{ steps.tag_version.outputs.version }}-release.apk

            # Cài qua ADB WiFi (loa và máy tính cùng WiFi)
            adb connect <IP_LOA>:5555
            adb install -r R1Y-v${{ steps.tag_version.outputs.version }}-release.apk
            ```
            Hoặc chạy script trong repo: `./scripts/install.sh <IP_LOA>`

            ### 🔄 Cập nhật trong giao diện
            Mở `http://<IP_LOA>:8088` → mục **Thêm** → **Cập nhật firmware** → **Cập nhật ngay**.
            Loa tự kiểm tra GitHub Releases của repo này.

            ### 🎵 Bộ lấy tiếng YouTube
            Mở `http://<IP_LOA>:8088` → mục **Nhạc** → **Bộ lấy tiếng YouTube**.
            Mảng JSON `[{"type":"piped|invidious|custom","url":"..."}]`, thử đúng thứ tự.
            Để `[]` thì loa tự tìm máy chủ công khai, cuối cùng là máy chủ nhạc.

            ### ✨ Tính năng
            - ✅ Trợ lý giọng nói Xiaozhi (wake word, TTS, LED)
            - ✅ Tìm kiếm YouTube chính xác (kế thừa Tube + LiteTube)
            - ✅ Cài qua WiFi, cập nhật từ GitHub ngay trong giao diện
            - ✅ Tự khởi động khi bật loa

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...v${{ steps.tag_version.outputs.version }}
          files: |
            release-apk/*.apk
            checksums/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dự phòng — tạo Release bằng gh CLI nếu bước trên lỗi
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.tag_version.outputs.version }}
        run: |
          set -e
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "R1-Y $VER" \
            --notes "R1-Y firmware cho loa Phicomm R1 — phiên bản $VER.

          ### Cài đặt
          \`\`\`bash
          python3 tools/r1y.py install --ip <IP_LOA>
          \`\`\`
          Tool tự tải APK trong Release này và cài qua ADB WiFi." \
            release-apk/*.apk checksums/checksums.txt

  notify:
    name: Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Success
        if: needs.build.result == 'success'
        run: echo "✅ Build thành công! APK có trong mục Actions."

      - name: Build Failed
        if: needs.build.result == 'failure'
        run: |
          echo "❌ Build thất bại! Xem log ở trên."
          exit 1
